# Copy to inventory.ini and set the server's IP / hostname.
#   cp inventory.example.ini inventory.ini
#
# Same VPS as ratelflix-transcriptions: its bootstrap.yml already installed your
# SSH key, disabled password login and set up ufw + fail2ban, so every playbook
# here connects as root with your key.

[dataviz]
prod ansible_host=YOUR.SERVER.IP.HERE

[dataviz:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
