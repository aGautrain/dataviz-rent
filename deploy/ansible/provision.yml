---
# ─────────────────────────────────────────────────────────────────────────────
# provision.yml — install Docker Engine + the compose plugin from Docker's apt
# repository (Debian's own docker-compose is the old v1). Key-based, idempotent.
# Leaves everything already on the VPS alone (nginx, ufw, other projects).
#
#   ansible-playbook provision.yml
# ─────────────────────────────────────────────────────────────────────────────
- name: Provision Docker
  hosts: dataviz
  gather_facts: true

  tasks:
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, rsync]
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Add Docker's apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Install Docker Engine and the compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
