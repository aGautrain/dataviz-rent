---
# ─────────────────────────────────────────────────────────────────────────────
# routing.yml — builds the travel-time data (MOTIS) and installs its nightly
# refresh. Run deploy.yml first, with COMPOSE_PROFILES=routing and
# MOTIS_URL=http://routing:8080 in production.env.
#
#   ansible-playbook routing.yml
#
# Made for a small VPS: it adds a swap file if the server has none, and MOTIS
# runs under memory and CPU caps (docker-compose.yml) so the other projects
# keep theirs. The first run downloads ~1 GB of OpenStreetMap and timetable
# data, then imports it mostly in swap: count an hour or more.
# ─────────────────────────────────────────────────────────────────────────────
- name: Travel times (MOTIS)
  hosts: dataviz
  gather_facts: false
  vars:
    swap_file: /swapfile
    swap_size_mb: 8192

  tasks:
    - name: Check for existing swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_in_use
      changed_when: false

    - name: Create a swap file (MOTIS's import needs more memory than the server has)
      when: swap_in_use.stdout | trim == ""
      block:
        - name: Allocate the swap file
          ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
          args:
            creates: "{{ swap_file }}"

        - name: Restrict it to root
          ansible.builtin.file:
            path: "{{ swap_file }}"
            mode: "0600"

        - name: Format and enable it
          ansible.builtin.shell: "mkswap {{ swap_file }} && swapon {{ swap_file }}"
          changed_when: true

        - name: Enable it at boot
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "{{ swap_file }} none swap sw 0 0"

    # Swap is only for the MOTIS containers, which are capped; keep the rest of
    # the server (ratelflix included) in RAM as long as possible.
    - name: Prefer RAM over swap
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/60-swappiness.conf

    - name: Build the data and (re)start MOTIS
      ansible.builtin.command:
        cmd: sh routing/refresh.sh
        chdir: "{{ app_dir }}"
      async: 10800
      poll: 30
      changed_when: true

    - name: Install cron (missing from minimal Debian images)
      ansible.builtin.apt:
        name: cron
        state: present

    - name: Start cron now and at boot
      ansible.builtin.service:
        name: cron
        state: started
        enabled: true

    # Nightly, because the Rennes timetables (STAR) only cover about a week.
    # The streets are only rebuilt once a week (prepare.sh), so this is short.
    - name: Refresh the timetables every night
      ansible.builtin.cron:
        name: "{{ project_name }} routing refresh"
        hour: "3"
        minute: "17"
        job: "cd {{ app_dir }} && sh routing/refresh.sh > /var/log/{{ project_name }}-routing.log 2>&1"
