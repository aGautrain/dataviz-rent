---
# ─────────────────────────────────────────────────────────────────────────────
# routing.yml — builds the travel-time data (MOTIS) and installs its weekly
# refresh. Run deploy.yml first, with COMPOSE_PROFILES=routing and
# MOTIS_URL=http://routing:8080 in production.env.
#
#   ansible-playbook routing.yml
#
# The first run downloads ~1 GB of OpenStreetMap and timetable data, then
# imports it: count tens of minutes.
# ─────────────────────────────────────────────────────────────────────────────
- name: Travel times (MOTIS)
  hosts: dataviz
  gather_facts: false

  tasks:
    - name: Check the server has the memory MOTIS needs
      ansible.builtin.shell: free -m | awk '/^Mem:/ {print $2}'
      register: total_mb
      changed_when: false

    - name: Stop if it doesn't
      ansible.builtin.fail:
        msg: >-
          The server has {{ total_mb.stdout }} MB of RAM. Importing Paris, Rennes
          and London needs about 6 GB, or MOTIS would compete with the other
          projects on this VPS.
      when: total_mb.stdout | int < 5500 and not (force_low_memory | default(false) | bool)

    - name: Build the data and (re)start MOTIS
      ansible.builtin.command:
        cmd: sh routing/refresh.sh
        chdir: "{{ app_dir }}"
      async: 7200
      poll: 30
      changed_when: true

    - name: Refresh the timetables every Sunday night
      ansible.builtin.cron:
        name: "{{ project_name }} routing refresh"
        weekday: "0"
        hour: "3"
        minute: "17"
        job: "cd {{ app_dir }} && sh routing/refresh.sh > /var/log/{{ project_name }}-routing.log 2>&1"
