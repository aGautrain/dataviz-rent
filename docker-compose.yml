# Production stack: database, migrations, app. Deployed by deploy/ansible.
#
# The VPS is shared with other projects, so this stack never binds 80/443: the
# host's nginx terminates TLS and proxies to the app on a loopback-only port.
# Binding to 127.0.0.1 also matters because Docker-published ports bypass ufw.

name: dataviz-rent

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataviz}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
      BETA_USERS: ${BETA_USERS:?set BETA_USERS in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Empty = travel times off. http://routing:8080 once MOTIS is set up.
      MOTIS_URL: ${MOTIS_URL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Triggers a listing collection every COLLECT_EVERY_SECONDS (default 6 h).
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      COLLECT_EVERY_SECONDS: ${COLLECT_EVERY_SECONDS:-21600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -sS --max-time 3600 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/collect || true
          echo
          sleep "$$COLLECT_EVERY_SECONDS"
        done
    depends_on: [app]

  # Travel times (MOTIS), opt-in: add `routing` to COMPOSE_PROFILES in .env.
  # Its data is built by routing/refresh.sh (profile `routing-import`).
  routing:
    profiles: ["routing"]
    image: ghcr.io/motis-project/motis:2.11.3
    restart: unless-stopped
    command: ["/motis", "server", "-d", "/data"]
    volumes:
      - routing-data:/data
    # Caps MOTIS so it can't starve the other projects on the VPS: past the
    # RAM cap it uses swap (slower answers) instead of taking memory from them.
    mem_limit: ${ROUTING_MEM_LIMIT:-700m}
    memswap_limit: ${ROUTING_MEMSWAP_LIMIT:-3g}
    cpus: 1

  routing-prepare:
    profiles: ["routing-import"]
    image: debian:trixie-slim
    command: ["sh", "/routing/prepare.sh"]
    volumes:
      - routing-input:/input
      - ./routing:/routing:ro

  routing-import:
    profiles: ["routing-import"]
    image: ghcr.io/motis-project/motis:2.11.3
    working_dir: /input
    command: ["/motis", "import", "-c", "/input/config.yml", "-d", "/data"]
    volumes:
      - routing-input:/input:ro
      - routing-data:/data
    # The import peaks well above the server's RAM: it runs mostly in swap, on
    # one core, at night (see refresh.sh). Slow, but the other projects keep
    # their memory and CPU.
    mem_limit: ${ROUTING_IMPORT_MEM_LIMIT:-800m}
    memswap_limit: ${ROUTING_IMPORT_MEMSWAP_LIMIT:-7g}
    cpus: 1

volumes:
  db-data:
  routing-input:
  routing-data:
