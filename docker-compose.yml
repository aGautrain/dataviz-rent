# Production stack: database, migrations, app. Deployed by deploy/ansible.
#
# The VPS is shared with other projects, so this stack never binds 80/443: the
# host's nginx terminates TLS and proxies to the app on a loopback-only port.
# Binding to 127.0.0.1 also matters because Docker-published ports bypass ufw.

name: dataviz-rent

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataviz}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
      BETA_USERS: ${BETA_USERS:?set BETA_USERS in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Triggers a listing collection every COLLECT_EVERY_SECONDS (default 6 h).
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      COLLECT_EVERY_SECONDS: ${COLLECT_EVERY_SECONDS:-21600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -sS --max-time 3600 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/collect || true
          echo
          sleep "$$COLLECT_EVERY_SECONDS"
        done
    depends_on: [app]

volumes:
  db-data:
