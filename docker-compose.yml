# Production stack for a single VPS: database, migrations, app, HTTPS proxy.
# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build`.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataviz}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataviz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataviz}
      BETA_USERS: ${BETA_USERS:?set BETA_USERS in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  db-data:
  caddy-data:
