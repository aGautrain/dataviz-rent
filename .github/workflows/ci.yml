name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dataviz
          POSTGRES_PASSWORD: dataviz
          POSTGRES_DB: dataviz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataviz" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dataviz:dataviz@localhost:5432/dataviz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
