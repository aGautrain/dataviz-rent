name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dataviz
          POSTGRES_PASSWORD: dataviz
          POSTGRES_DB: dataviz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataviz" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dataviz:dataviz@localhost:5432/dataviz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the production images and runs the stack the way the VPS does.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway production env
        run: printf 'APP_PORT=3100\nPOSTGRES_PASSWORD=ci\nBETA_USERS=ci:ci\nCRON_SECRET=ci\n' > .env
      - run: docker compose up -d --build --wait app
      - name: Health check on the loopback port
        run: curl -fsS --retry 15 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:3100/api/health
      - name: Pages require tester credentials
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci http://127.0.0.1:3100/)" = 200
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # Loads a tiny synthetic network into the real MOTIS image and checks that
  # the app's client reads its travel times correctly.
  routing:
    runs-on: ubuntu-latest
    env:
      MOTIS_IMAGE: ghcr.io/motis-project/motis:2.11.3
      FIXTURE: routing/test/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Build the fixture network
        run: |
          python3 routing/test/make_fixture.py "$FIXTURE"
          osmium cat "$FIXTURE/town.osm" -o "$FIXTURE/town.osm.pbf"
          osmium fileinfo -e "$FIXTURE/town.osm.pbf" | grep -E "Number of (nodes|ways)"
      - name: Import it with MOTIS
        run: docker run --rm -u 0 -v "$PWD/$FIXTURE:/input" -w /input "$MOTIS_IMAGE" /motis import -c config.yml -d data
      - name: Start MOTIS
        run: |
          docker run -d --name motis -u 0 -p 8080:8080 -v "$PWD/$FIXTURE:/input" "$MOTIS_IMAGE" /motis server -d /input/data
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
      - run: npx vitest run tests/motis-live.test.ts
        env:
          MOTIS_TEST_URL: http://127.0.0.1:8080
      - name: MOTIS logs and raw answers on failure
        if: failure()
        run: |
          docker logs motis || true
          when="$(sed -n 's/^  first_day: "\(.*\)"$/\1/p' routing/config.yml)T08:00:00Z"
          echo "--- one-to-many-intermodal (as the app sends it)"
          curl -sS -X POST -H 'content-type: application/json' http://127.0.0.1:8080/api/experimental/one-to-many-intermodal \
            -d "{\"one\":\"48.0,2.097\",\"many\":[\"48.0,2.003\",\"48.0,2.093\"],\"time\":\"$when\",\"arriveBy\":true,\"maxTravelTime\":120,\"maxDirectTime\":7200}"
          echo; echo "--- one-to-many walking"
          curl -sS "http://127.0.0.1:8080/api/v1/one-to-many?one=48.0;2.097&many=48.0;2.003,48.0;2.093&mode=WALK&max=7200&maxMatchingDistance=250&arriveBy=true"
          echo; echo "--- plan"
          curl -sS "http://127.0.0.1:8080/api/v6/plan?fromPlace=48.0,2.003&toPlace=48.0,2.097&time=$when&arriveBy=true" | head -c 3000
