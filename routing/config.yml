# MOTIS configuration for the beta cities. prepare.sh downloads the files named
# here into the import directory; `motis import` turns them into /data.
# Sized for a small VPS (2 vCPU, 2 GB RAM + swap): one worker thread, tight
# map areas and a single day of timetables. Queries are slower, not wrong.
server:
  port: 8080
  n_threads: 1
osm: region.osm.pbf
street_routing: true
timetable:
  # The one day searches ask for (TIMETABLE_DAY in src/routing/arrival.ts): a
  # regular Monday, imported once. prepare.sh checks the timetables cover it.
  first_day: "2026-11-02"
  num_days: 1
  railviz: false
  with_shapes: false
  datasets:
    idfm:
      path: idfm.gtfs.zip
    star:
      path: star.gtfs.zip
    london:
      path: london.gtfs.zip
limits:
  # The app routes up to 1000 listings per request (src/routing/motis.ts).
  onetomany_max_many: 1000
logging:
  log_level: info
