# MOTIS configuration for the beta cities. prepare.sh downloads the files named
# here into the import directory; `motis import` turns them into /data.
# Sized for a small VPS (2 vCPU, 2 GB RAM + swap): one worker thread, tight
# map areas and ten days of timetables. Queries are slower, not wrong.
server:
  port: 8080
  n_threads: 1
osm: region.osm.pbf
street_routing: true
timetable:
  first_day: TODAY
  # Memory grows with the days loaded. The nightly refresh reloads them, and
  # searches always ask for the next working day.
  num_days: 10
  railviz: false
  with_shapes: false
  datasets:
    idfm:
      path: idfm.gtfs.zip
    star:
      path: star.gtfs.zip
      # STAR only publishes about a week ahead: repeat its weekly pattern past
      # the end of the feed. When the next version is out, prepare.sh adds it
      # here, above these lines, so it is the one that gets extended.
      extend_calendar: true
    london:
      path: london.gtfs.zip
limits:
  # The app routes up to 1000 listings per request (src/routing/motis.ts).
  onetomany_max_many: 1000
logging:
  log_level: info
